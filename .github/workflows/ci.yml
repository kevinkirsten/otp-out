# CLI checks. The web page has its own workflow (web.yml).
name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "web/**"
      - ".github/workflows/web.yml"
      - ".github/workflows/pages.yml"
  pull_request:
    paths-ignore:
      - "web/**"
      - ".github/workflows/web.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: go test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: "1.27.x"
      - name: go vet
        run: go vet -tags nodynamic,wasm2go ./...
      - name: go test (release build tags)
        run: go test -tags nodynamic,wasm2go ./...
      - name: go test -race
        # The race detector needs cgo and a C compiler; Windows runners
        # are skipped here.
        if: runner.os != 'Windows'
        run: go test -race -tags nodynamic,wasm2go ./...
      - name: go test (default tags, and without HEIC)
        if: runner.os == 'Linux'
        run: |
          go test ./...
          go test -tags noheic ./internal/qrimage/ ./internal/cli/
      - name: cross-compile without cgo
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: "0"
        run: |
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -tags nodynamic,wasm2go -o /dev/null . || exit 1
            echo "ok $target"
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: "1.27.x"
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: 8.30.1

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: check
      - name: packaging scripts
        run: |
          node --check packaging/fill.mjs
          node --check packaging/npm/build.mjs
          node --check packaging/npm/otp-out/bin/otp-out.js
